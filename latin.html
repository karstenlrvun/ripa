<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- connect-src names the deployed sync Worker exactly, matching SYNC_ENDPOINT in js/sync.js. It was a wildcard over the whole workers.dev space while the subdomain was still unknown; it is known now, so this is the tighter form. Change both together if the Worker is ever redeployed under another name. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self'; connect-src https://cotidie-sync.karsten-vun.workers.dev; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cotidie">
<meta name="theme-color" content="#fbf7ec">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>Cotidie — Latin</title>
<style>
:root{
  --serif:"Palatino","Palatino Linotype","Book Antiqua",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  --bg:#fbf7ec; --panel:#f5efdf; --ink:#2a2318; --muted:#6f6350; --faint:#988c75;
  --line:#e3d9c1; --coral:#8c2f26; --accent-soft:#f0e3d8; --raise:#fffdf6;
  --good:#5a6b32; --good-bg:#e6e5d4; --good-br:#c7cab0;
  --bad:#8c2f26; --bad-bg:#f3ded9; --bad-br:#dcb9ac;
  /* 2026-08-31: five sizes with real steps, replacing nine that collapsed into
     three tiers -- 12, 12.5, 13 and 13.33px were all doing the same job. Every
     step here is at least 1.18x, so each one reads as a different rank. */
  --fs-label:11px; --fs-meta:13px; --fs-body:15px; --fs-title:19px; --fs-display:27px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1a160f; --panel:#241f16; --ink:#ece3cf; --muted:#a89a80; --faint:#7a6f5c;
    --line:#3a3222; --coral:#d4795e; --accent-soft:#3f2a1f; --raise:#2c2519;
    --good:#a9bd72; --good-bg:#393b25; --good-br:#565c39;
    --bad:#d4795e; --bad-bg:#3f2a1f; --bad-br:#5c3a2c;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg)}
body{
  color:var(--ink); font-family:var(--sans); font-size:16px; line-height:1.6;
  -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
  padding:calc(20px + env(safe-area-inset-top)) 20px calc(40px + env(safe-area-inset-bottom));
  max-width:30rem; margin:0 auto;
}
h1{font-family:var(--serif);font-weight:400;font-size:1.7rem;margin:0 0 2px}
h2{font-family:var(--serif);font-weight:400;font-size:1.3rem;margin:0 0 2px}
.sub{color:var(--muted);font-size:14px;margin:0 0 22px}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:6px}
button.back{background:none;border:none;color:var(--muted);font-size:15px;padding:6px 0;cursor:pointer;font-family:var(--sans)}
button.back:active{color:var(--coral)}

a.card,button.card{display:block;width:100%;text-align:left;text-decoration:none;color:inherit;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;
  margin-bottom:16px;font-family:var(--sans);cursor:pointer;line-height:1.5}
a.card:active,button.card:active{border-color:var(--coral);background:var(--accent-soft)}
.card .t{font-family:var(--serif);font-size:var(--fs-title);line-height:1.25;margin-bottom:3px}
.card .d{color:var(--muted);font-size:var(--fs-meta);line-height:1.45}
.card.study{border-color:var(--good-br);background:var(--good-bg)}
.card.study .t{color:var(--good)}

.sect{margin-top:34px}
.sect h3{font-size:var(--fs-label);font-weight:600;color:var(--faint);text-transform:uppercase;
  letter-spacing:.09em;margin:0 0 12px;line-height:1.4}

.tabs{display:flex;gap:6px;margin:16px 0}
.tabs button{flex:1;padding:9px 0;border:1px solid var(--line);background:var(--panel);
  color:var(--muted);border-radius:10px;font-family:var(--sans);font-size:14px;cursor:pointer}
.tabs button.on{background:var(--coral);border-color:var(--coral);color:var(--raise)}

table.para{width:100%;border-collapse:collapse;margin:14px 0 6px;font-family:var(--serif);font-size:1.02rem}
table.para th{text-align:left;color:var(--faint);font-family:var(--sans);font-size:11.5px;
  text-transform:uppercase;letter-spacing:.06em;font-weight:500;padding:0 8px 8px;border-bottom:1px solid var(--line)}
table.para td{padding:7px 8px;border-bottom:1px solid var(--line)}
table.para td.case{color:var(--muted);font-family:var(--sans);font-size:12.5px;white-space:nowrap}
.vtable{margin:18px 0}
.vtable h4{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 6px}

.wordlist{margin-top:8px}
.wordrow{display:flex;justify-content:space-between;align-items:center;padding:11px 4px;
  border-bottom:1px solid var(--line);cursor:pointer}
.wordrow:active{background:var(--accent-soft)}
.wordrow .lemma{font-family:var(--serif);font-size:1.05rem}
.wordrow .gloss{color:var(--muted);font-size:13px}
.wordrow .gender{color:var(--faint);font-size:11px;margin-left:6px}

.prompt-box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px 20px;margin:18px 0}
.prompt-head{color:var(--muted);font-size:13px;margin-bottom:4px}
.prompt-lemma{font-family:var(--serif);font-size:1.6rem;margin-bottom:2px}
.prompt-cell{color:var(--coral);font-size:14px;font-weight:600;letter-spacing:.02em}
.answer-row{display:flex;gap:8px;margin-top:16px}
input.ans{flex:1;font-family:var(--serif);font-size:1.15rem;padding:11px 13px;border-radius:10px;
  border:1px solid var(--line);background:var(--raise);color:var(--ink)}
input.ans:focus{outline:none;border-color:var(--coral)}
button.go{background:var(--coral);color:var(--raise);border:none;border-radius:10px;padding:0 18px;font-size:15px;cursor:pointer}
button.go:active{opacity:.85}

.feedback{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:14.5px}
.feedback.ok{background:var(--good-bg);border:1px solid var(--good-br);color:var(--good)}
.feedback.no{background:var(--bad-bg);border:1px solid var(--bad-br);color:var(--bad)}
.feedback .answer{font-family:var(--serif);font-size:1.05rem;margin-top:2px;color:var(--ink)}

.quietlink{background:none;border:none;color:var(--faint);font-size:13px;cursor:pointer;
  padding:8px 0;font-family:var(--sans);text-decoration:underline}
.progress{color:var(--faint);font-size:12.5px;margin-bottom:2px}
.progress-bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:16px}
.progress-fill{height:100%;background:var(--coral)}

.empty{color:var(--muted);text-align:center;padding:40px 10px;font-size:15px}
.note{color:var(--faint);font-size:var(--fs-meta);margin-top:16px;line-height:1.55}
.summary-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}
.summary-row .k{color:var(--muted)}

/* ---- Settings form controls (2026-08-21, rollover + new-cell allowance) ---- */
.faintcell{color:var(--faint)}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px}
.field label{color:var(--muted);font-size:14px}
.field select,.field input.num,.field input[type="text"]{font-family:var(--sans);font-size:15px;
  padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--raise);
  color:var(--ink);min-width:8.5rem}
.field select:focus,.field input.num:focus,.field input[type="text"]:focus{outline:none;border-color:var(--coral)}
.field input[type="text"]{flex:1;min-width:0;letter-spacing:.06em;text-transform:uppercase}
.field input[type="text"]::placeholder{text-transform:none;letter-spacing:0}
/* The one thing on Home that is not an invitation: how far this device has
   drifted from the last copy that reached the server. */
.warn{display:block;width:100%;text-align:left;background:var(--bad-bg);border:1px solid var(--bad-br);
  color:var(--bad);border-radius:12px;padding:11px 14px;margin:0 0 16px;font-family:var(--sans);
  font-size:var(--fs-meta);line-height:1.45;cursor:pointer}

/* ---- Stats screen + Study-days calendar (ported from vocabula, 2026-08-09) ---- */
:root{ --amber:#a67c1e; --amber-bg:#efe6cf; }
@media (prefers-color-scheme: dark){ :root{ --amber:#d9b04c; --amber-bg:#3a3018; } }

.s-unseen{background:var(--line)}
.s-learning{background:var(--coral)}
.s-young{background:var(--amber)}
.s-mature{background:var(--good)}
.cellDot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:middle}

.stackbar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--line);margin-top:4px}
.legend{display:flex;flex-wrap:wrap;gap:10px 16px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.legend .sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle}

.wpart{margin:16px 0}
.wpart h3{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;
  font-weight:600;color:var(--muted);margin:0 0 8px;text-transform:none;letter-spacing:0}
.wpart h3 b{color:var(--faint);font-weight:500;font-size:12px}
.wgrid{display:flex;flex-wrap:wrap;gap:3px}
.wbox{width:11px;height:11px;border-radius:2px}

.strip{display:flex;gap:3px;margin-top:6px}
.dot{flex:1;aspect-ratio:1;border-radius:2px;background:var(--line);max-width:9px}
.dot.did{background:var(--coral)}
.dot.today{outline:1.5px solid var(--ink);outline-offset:1px}
.streakNote{margin-top:8px}

.fold{margin-top:14px}
.fold summary{cursor:pointer;color:var(--coral);font-size:13px;list-style:none}
.fold summary::-webkit-details-marker{display:none}
.fold summary::before{content:'\25B8\0020';display:inline-block;transition:transform .15s}
.fold[open] summary::before{transform:rotate(90deg)}

.calHead{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.calNav{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px 10px}
.calTitle{font-family:var(--serif);font-size:1rem}
.calDow{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;color:var(--faint);
  font-size:10.5px;margin-top:10px}
.calGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:4px}
.calCell{position:relative;aspect-ratio:1;border-radius:6px;background:var(--panel);
  border:1px solid var(--line);font-size:10px;padding:3px;overflow:hidden}
.calCell.out{opacity:.35;border-color:transparent;background:none}
.calCell.did{background:var(--accent-soft);border-color:var(--coral)}
.calCell.today{border-color:var(--ink);border-width:1.5px}
.calNum{display:block;color:var(--faint);font-size:9.5px}
.calCell.did .calNum{color:var(--muted)}
.calNew,.calWords,.calTot{display:block;font-size:9px;line-height:1.3}
.calNew{color:var(--good)}
.calWords{color:var(--coral)}
.calTot{color:var(--faint)}
/* ================= 2026-08-30: the interface port from vocabula ==========
   Eleven decisions, his; the reasoning is in in-progress/UI_PORT_DECISIONS.md
   and the demo beside it. Everything below is additive -- no existing rule
   was changed, so every screen not named here looks exactly as it did.
   ======================================================================== */

/* ---- the bar. Stats and Settings stop being two of four full-width cards
   and become the two top corners, which is what freed 185px on Home. The
   negative margin pulls it out of body's own 20px padding so the icons sit
   where a phone's thumbs expect them, at 12px from each edge. ---- */
.hidden{display:none!important}
.bar{display:flex;align-items:center;gap:10px;margin:-6px -8px 12px}
.bar .icon{width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  background:none;border:none;color:var(--muted);font-size:19px;border-radius:11px;
  cursor:pointer;flex:0 0 auto;font-family:var(--sans);line-height:1}
.bar .icon:active{background:var(--panel);color:var(--coral)}
.bar .wm{flex:1;text-align:center;font-family:var(--serif);font-size:var(--fs-title);color:var(--ink)}
.bar .icon svg{display:block}
.bar .title{flex:1;text-align:center;font-size:15px;font-weight:500;color:var(--ink)}
.bar .spacer{width:44px;flex:0 0 auto}

/* ---- Review three-quarters, Look up one quarter. The narrow one is a
   magnifier with a caption under it, his choice over letting "Look up a
   form" wrap: at a quarter of 335px there are 84px to play with. ---- */
/* ---- Review, number-first (2026-08-31). Look up left this row for the top
   bar, so Review takes the whole width. The count is what the button is
   offering and it used to be 13px muted under an 18px word that never
   changes; now it is the number. ---- */
.card.study .rvTop{font-size:var(--fs-label);text-transform:uppercase;letter-spacing:.09em;
  font-weight:600;color:var(--good);line-height:1.2;margin-bottom:5px}
.card.study .rvNum{font-family:var(--serif);font-size:var(--fs-display);line-height:1.05;
  color:var(--good);font-variant-numeric:tabular-nums}
.card.study .rvNum small{font-size:var(--fs-meta);color:var(--muted);letter-spacing:.01em}
.card.study .rvSub{color:var(--muted);font-size:var(--fs-meta);line-height:1.45;margin-top:4px}
.capHint{display:block;width:100%;text-align:left;background:none;border:none;padding:8px 2px 0;
  color:var(--coral);font-size:var(--fs-meta);font-family:var(--sans);cursor:pointer;
  text-decoration:underline;line-height:1.45}

/* ---- Paradigms as a ruled list (2026-08-31). Eight instances of one thing:
   a name, a system count, a due count. As cards the counts were incomparable
   -- each was the tail of a muted sentence -- so nothing showed that one group
   is twenty-two times another. Right-aligned and tabular, that reads at a
   glance, and there are no boxes left to nest. ---- */
.rowHead{display:flex;align-items:baseline;gap:12px;padding:0 2px 7px;
  border-bottom:1px solid var(--line);font-size:var(--fs-label);text-transform:uppercase;
  letter-spacing:.08em;color:var(--faint);font-weight:600;line-height:1.3}
.rowHead .rowT{font-family:var(--sans);font-size:var(--fs-label)}
button.row{display:flex;width:100%;align-items:baseline;gap:12px;text-align:left;color:inherit;
  background:none;border:0;border-bottom:1px solid var(--line);padding:13px 2px;cursor:pointer;
  font-family:var(--sans);line-height:1.5}
button.row:active{background:var(--accent-soft)}
.rowT{font-family:var(--serif);font-size:var(--fs-title);line-height:1.25;flex:1;min-width:0}
.rowM{font-size:var(--fs-meta);color:var(--faint);white-space:nowrap;
  font-variant-numeric:tabular-nums;min-width:3.4rem;text-align:right}
.rowD{font-size:var(--fs-body);color:var(--ink);font-variant-numeric:tabular-nums;
  white-space:nowrap;min-width:3.6rem;text-align:right;font-weight:600}
.rowD.zero{color:var(--faint);font-weight:400}
@media (hover:hover) and (pointer:fine){ button.row:hover{background:var(--accent-soft)} }

/* ---- graded study-days strip: same 35 squares, shaded by how much was done
   against his own average rather than on/off. Geometry unchanged. ---- */
.dot.lit{background:var(--coral)}

/* ---- where you keep slipping ---- */
.trow{display:grid;grid-template-columns:auto 1fr auto;gap:2px 9px;padding:9px 2px;
  border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;
  border-top:0;text-align:left;font-family:var(--sans);color:inherit;cursor:pointer;align-items:baseline}
.trow:last-of-type{border-bottom:none}
.trow:active{background:var(--accent-soft)}
.tFlag{grid-row:1/3;align-self:center;width:10px;color:var(--coral);font-size:11px;line-height:1}
.tLemma{font-family:var(--serif);font-size:1.02rem;min-width:0;overflow-wrap:anywhere}
.tScore{font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap;justify-self:end}
.tScore b{color:var(--bad-ink);font-weight:600}
/* the grammar label gets the full width of the row's second line, so it is
   never the thing that gets cut */
.tCell{grid-column:2/4;color:var(--muted);font-size:12.5px;line-height:1.35}
.tGroup{font-family:var(--sans);font-size:.95rem;min-width:0}
.troubleBar{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.troubleFoot{color:var(--faint);font-size:12.5px;margin-top:12px;line-height:1.5}

/* ---- keycaps. Shown only where there is a keyboard to press: on a phone a
   picture of a key is decoration, and this app is mostly used on one. ---- */
.keycap{display:none}
@media (hover:hover) and (pointer:fine){
  .keycap{display:inline-block;margin-left:7px;font-family:var(--sans);font-size:10px;
    line-height:1;padding:3px 5px;border:1px solid var(--line);border-bottom-width:2px;
    border-radius:4px;color:var(--faint);background:var(--raise);vertical-align:middle;
    letter-spacing:.02em}
  .icon .keycap{margin-left:5px}
}
.scRow{display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:5px 0;font-size:13.5px;color:var(--muted)}
.scRow .keycap{display:inline-block;margin:0}

/* ---- what changed ---- */
.logEntry{border-bottom:1px solid var(--line);padding:13px 0}
.logEntry:last-child{border-bottom:none}
.logVer{font-size:11px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase;margin-bottom:5px}
.logLine{font-size:13.5px;color:var(--muted);margin-bottom:7px;line-height:1.5}
.logLine:last-child{margin-bottom:0}
.logLine b{color:var(--ink);font-weight:600}

/* ---- on a laptop: two balanced columns instead of a 480px ribbon down the
   middle of an empty screen. Home only, and only where there is room --
   below the threshold .cols2 is display:contents, so the markup flows in
   exactly the single column it did before and nothing else changes. ---- */
.cols2, .cols2 > div{display:contents}
@media (min-width:900px){
  /* Two equal columns ended 408px apart, which reads as broken; a narrower
     rail that ends early reads as intentional. The section panels are gone
     with them -- a card used to sit on its third surface, padded wider (18px)
     than the panel holding it (16px), with a radius that made its corners
     bulge against the outer ones. */
  body[data-screen="home"]{max-width:70rem}
  body[data-screen="home"] .cols2{display:grid;
    grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:44px;align-items:start;margin-top:34px}
  body[data-screen="home"] .cols2 > div{display:block;min-width:0}
  body[data-screen="home"] .cols2 .sect{margin-top:30px}
  body[data-screen="home"] .cols2 .sect:first-child{margin-top:0}
  /* Review is the primary action and keeps the full width on a phone, but at
     70rem a 1,120px band holding three short lines in its left corner reads as
     unfinished -- an emptiness that only appeared once Look up left the row.
     Capping it to the content column, by the same arithmetic the grid uses,
     lines it up with the list it acts on. */
  body[data-screen="home"] .card.study,
  body[data-screen="home"] .warn{max-width:calc((100% - 44px) * 1.9 / 2.9)}
}
</style>
</head>

<script>
/* ======================================================================
   Cotidie — Latin engine UI. Vanilla DOM, event delegation, no framework.
   Three modes per HANDOFF.md §2: Table (reference, always open) ->
   Recite (whole paradigm in canonical order, self-checked) -> Drill
   (FSRS-scheduled random cell, auto-graded). Table/Recite need no vocab
   pick beyond the class's own `example` specimen -- that IS the paradigm
   students traditionally recite (mensa/mensae..., amo/amas/amat...), not
   a random word. Drill pulls a due-card queue across the whole deck (or
   one system, if entered from a system screen).
   ====================================================================== */

const NOUN_CLASSES = classesOfKind(LATIN_PARADIGMS, 'noun');
const VERB_CLASSES = classesOfKind(LATIN_PARADIGMS, 'verb').filter(k => !LATIN_PARADIGMS[k].literal);
const IRREGULAR_VERB_CLASSES = classesOfKind(LATIN_PARADIGMS, 'verb').filter(k => LATIN_PARADIGMS[k].literal);

// ------------------------------------------------------------ GROUPS ----
// Home shows one card per GROUP; each group's systems now live on their own
// screen. The groups, their order and their contents are UNCHANGED -- every
// split has its reason recorded on the class lists above and none of them
// moved. What changed is only that a group is reached rather than scrolled
// to. Home was 22 cards over 2.8 phone screenfuls -- not the problem Greek had,
// but the two decks stay the same shape on purpose.
// A group with no classes drops out, exactly as the `if (X.length)` guards
// this replaces did.
const CLASS_GROUPS = [
  { id:'nouns',   label:'Nouns',           classes:NOUN_CLASSES },
  { id:'verbs',   label:'Verbs',           classes:VERB_CLASSES },
  { id:'irregt',  label:'Irregular verbs', classes:IRREGULAR_VERB_CLASSES },
].filter(g => g.classes.length);

// class key -> group id, for bucketing the due list and nothing else.
const GROUP_OF_CLASS = {};
CLASS_GROUPS.forEach(g => g.classes.forEach(k => { GROUP_OF_CLASS[k] = g.id; }));

const STORE_KEY = STORE_KEYS.latin;   // defined once in js/sync.js

// A rollover change scheduled on a previous visit matures at a boundary, not
// at a moment anything is running -- so it is folded in on load rather than
// by a timer. No-op until that boundary has passed. Applied on every store
// arrival, not once, since a sync adopt replaces the store wholesale.
function applyDeckDefaults(){
  commitRollover(store.settings, Date.now());
}

const app = document.getElementById('app');

function render(){
  if (view.screen==='home') app.innerHTML = renderHome();
  else if (view.screen==='group') app.innerHTML = renderGroup(view.gid);
  else if (view.screen==='system') app.innerHTML = renderSystem(view.cls, view.tab||'table');
  else if (view.screen==='recite') renderRecite();     // manages its own DOM (needs live input focus/state)
  else if (view.screen==='drill') renderDrill();        // ditto

  document.body.dataset.screen = view.screen;
}

function go(next){ view = next; render(); window.scrollTo(0,0); }

// ---------------------------------------------------------------- HOME ----
// capNew, not the raw due list: if a new-cell allowance is set, the number
// on the home screen has to be the number the drill will really ask for.
function homeDue(){
  const now = Date.now();
  const due = capNew(store, dueCards(store, LATIN_VOCAB, LATIN_PARADIGMS, now), now);
  // Bucketed from ONE capped list, deliberately: capNew() spends a per-day
  // new-cell allowance, so calling it once per group would hand every group
  // the same remaining allowance and the group numbers would sum to more than
  // the Review button's. Bucketing makes them add up by construction.
  const byGroup = {};
  due.forEach(it => {
    const g = GROUP_OF_CLASS[it.entry.class];
    if (g) byGroup[g] = (byGroup[g]||0) + 1;
  });
  return { total: due.length, byGroup };
}

// The five worst cells, and the button that drills only those.
function troubleSectionHtml(list){
  // Nothing to say on a deck that has never been answered -- an empty section
  // explaining a feature you have not reached yet is just noise on a first
  // run. Once there IS history, say why it is still empty rather than leaving
  // a feature he chose invisible with no explanation.
  if (!list.length){
    if (!store.log.length) return '';
    return `<div class="sect"><h3>Where you keep slipping</h3>
      <p class="note" style="margin-top:0">Nothing yet. A cell appears here once you have
      answered it ${TROUBLE_FLOOR} times and missed at least one &mdash; sooner than that sounds,
      because a cell you miss comes back within minutes.</p></div>`;
  }
  const rows = list.map(t => troubleRowHtml(t)).join('');
  return `<div class="sect"><h3>Where you keep slipping</h3>${rows}
    <button class="card" data-action="drill-trouble" style="margin-top:11px">
      <div class="t">Drill just these</div>
      <div class="d">the cells you miss most, nothing else</div></button>
    <button class="card" data-action="open-trouble">
      <div class="t">See the full list</div>
      <div class="d">every cell ranked, and by tense, voice or case</div></button></div>`;
}

// Latin's cellLabel() needs the word's CLASS, which a trouble row -- rebuilt
// from the log -- does not carry. Resolved through a lazily-built id->entry
// map rather than a .find() per row: the full list runs to hundreds of rows
// and LATIN_VOCAB to 153, and that product is a real cost on every render.
let _vocabById = null;
function entryById(id){
  if (!_vocabById){ _vocabById = Object.create(null); LATIN_VOCAB.forEach(e => { _vocabById[e.id] = e; }); }
  return _vocabById[id] || null;
}
function troubleCellLabel(t){
  const p = splitCardId(t.cardId);
  const e = p && entryById(p.wordId);
  // A word can leave the deck while its log rows remain; naming the category
  // alone is better than throwing on a row nobody can act on any more.
  if (!e || !LATIN_PARADIGMS[e.class]) return CATEGORY_LABELS[t.category] || String(t.category);
  return cellLabel(e.class, { category:t.category, cell:t.cell });
}

// Pressing a row turns its flag on or off -- the only per-cell action there
// is, so the row IS the button and nothing appears on hover.
function troubleRowHtml(t){
  const pct = Math.round(t.rate*100);
  return `<button class="trow" data-action="toggle-flag" data-id="${escHtml(t.cardId)}"
      aria-label="${isFlagged(store, t.cardId)?'Unflag':'Flag'} ${escHtml(t.lemma||'')}">
    <span class="tFlag">${isFlagged(store, t.cardId) ? '&#9873;' : ''}</span>
    <span class="tLemma">${escHtml(t.lemma||'')}</span>
    <span class="tScore"><b>${t.misses}</b>/${t.attempts} &middot; ${pct}%</span>
    <span class="tCell">${escHtml(troubleCellLabel(t))}</span>
  </button>`;
}

// ----------------------------------------------- STUDY DAYS / STATS (§10c) ----
// All derived on demand from store.log via js/stats.js's computeDayIndex() --
// no persisted day-aggregate, see that file's own header comment for why.
// Shaded by how much was done that day against his own average, not merely
// on/off -- a 12-answer day and a 90-answer day used to look identical. The
// baseline is the mean of the days actually STUDIED rather than of all 35: a
// week off would otherwise drag the average down and repaint every ordinary
// day afterwards as a heavy one. Capped at twice that average so a single
// enormous session cannot wash every other day out to nothing, and floored at
// 22% so a day with one answer still reads as a day worked.
function stripHtml(){
  const idx = computeDayIndex(store.log, store.settings.rollover);
  const d = dayKey(Date.now(), store.settings.rollover);
  const counts = [];
  for (let i=34;i>=0;i--){ const r = idx[d-i]; if (r && r.n) counts.push(r.n); }
  const avg = counts.length ? counts.reduce((a,b)=>a+b,0)/counts.length : 0;
  let h = '';
  for (let i=34; i>=0; i--){
    const rec = idx[d-i], n = (rec && rec.n) || 0;
    const pct = n ? Math.round(22 + 78*Math.min(1, n/Math.max(1, avg*2))) : 0;
    // .lit carries a flat fallback, so a browser without color-mix() still
    // shows a worked day as worked rather than as an empty one
    const style = n ? ` style="background:color-mix(in srgb, var(--coral) ${pct}%, var(--panel))"` : '';
    h += `<div class="dot${n?' lit':''}${i===0?' today':''}"${style} title="${n?n+' answered':'nothing'}"></div>`;
  }
  return h;
}

function streakNoteText(){
  const idx = computeDayIndex(store.log, store.settings.rollover);
  const streak = currentStreak(idx, dayKey(Date.now(), store.settings.rollover));
  return streak ? (streak+' day'+(streak===1?'':'s')+' running') : 'No streak yet — the first day starts it.';
}
function calendarHtml(){
  if (calY==null){ const n=new Date(); calY=n.getFullYear(); calM=n.getMonth(); }
  const idx = computeDayIndex(store.log, store.settings.rollover);
  const d0 = dayKey(Date.now(), store.settings.rollover);
  const sun = new Date(); sun.setDate(sun.getDate()-sun.getDay());
  const dowHtml = [0,1,2,3,4,5,6].map(i =>
    `<div>${new Date(sun.getFullYear(),sun.getMonth(),sun.getDate()+i).toLocaleDateString(undefined,{weekday:'narrow'})}</div>`
  ).join('');
  let gridHtml = '';
  monthMatrix(calY,calM).forEach(week => week.forEach(cell => {
    if (!cell.inMonth){ gridHtml += `<div class="calCell out">${cell.d}</div>`; return; }
    const dk = dayKeyForDate(cell.y, cell.m, cell.d, store.settings.rollover);
    const st = dayStatsFor(idx, dk);
    const cls = ['calCell'];
    if (st.studied) cls.push('did');
    if (dk===d0) cls.push('today');
    const nums = st.studied
      ? `<span class="calNew">${st.intro}</span><span class="calWords">${st.words}</span><span class="calTot">${st.ratings}</span>`
      : '';
    gridHtml += `<div class="${cls.join(' ')}"><span class="calNum">${cell.d}</span>${nums}</div>`;
  }));
  return `
    <div class="calHead">
      <button class="calNav" data-action="cal-prev" aria-label="Previous month">&lsaquo;</button>
      <div class="calTitle">${new Date(calY,calM,1).toLocaleDateString(undefined,{month:'long',year:'numeric'})}</div>
      <button class="calNav" data-action="cal-next" aria-label="Next month">&rsaquo;</button>
    </div>
    <div class="calDow">${dowHtml}</div>
    <div class="calGrid">${gridHtml}</div>`;
}
function shiftCalMonth(delta){
  if (calY==null){ const n=new Date(); calY=n.getFullYear(); calM=n.getMonth(); }
  calM += delta;
  if (calM<0){ calM=11; calY--; } else if (calM>11){ calM=0; calY++; }
}

// ------------------------------------------------- TROUBLE (2026-08-30) ----
// The ranked list behind Home's five rows. Two things it does that the
// shortlist cannot: it runs all the way down to the cells he never gets
// wrong (he asked for "worst to best", which has to include the best), and
// it pivots onto the axes of the category -- tense, voice, mood for verbs,
// case for nouns and adjectivals -- so "the aorist is what kills me" is a
// question the app can answer, not just "this one cell is".
//
// The grouped numbers are SUMS, not averages of the per-cell rates: see
// troubleByAxis() in js/stats.js for why that distinction decides the order.
const TROUBLE_AXIS_TITLE = { tense:'By tense', voice:'By voice', mood:'By mood', 'case':'By case' };

function renderTrouble(){
  const axis = view.axis || 'cells';
  const flaggedOnly = !!view.flagged;
  const axes = troubleAxes(store);
  const chips = ['cells'].concat(axes).map(a =>
    `<button class="togglebtn${a===axis?' active':''}" data-action="trouble-axis" data-axis="${a}">${
      a==='cells' ? 'Every cell' : TROUBLE_AXIS_TITLE[a]}</button>`).join('');
  const nFlagged = flaggedCount(store);
  const flagChip = nFlagged
    ? `<button class="togglebtn${flaggedOnly?' active':''}" data-action="trouble-flagged">&#9873; Flagged (${nFlagged})</button>`
    : '';

  const group = view.group || null;
  const groupChip = group
    ? `<button class="togglebtn active" data-action="trouble-clear-group">${
        escHtml(axisLabel(group.axis, group.key))} &times;</button>`
    : '';

  let body, foot;
  if (axis === 'cells'){
    let list = troubleCells(store, { includeClean:true });
    if (group) list = list.filter(t => categoryAxes(t.category)[group.axis] === group.key);
    if (flaggedOnly) list = list.filter(t => isFlagged(store, t.cardId));
    body = list.length
      ? list.map(troubleRowHtml).join('')
      : `<p class="empty">${flaggedOnly ? 'Nothing flagged yet.'
          : 'Nothing ranked yet — a cell joins this list once you have answered it '+TROUBLE_FLOOR+' times.'}</p>`;
    foot = `Ranked by how often you get it wrong, not by how many times &mdash; a cell you have
      missed 3 of 4 sits above one you have missed 9 of 200. Cells answered fewer than
      ${TROUBLE_FLOOR} times are left out until there is enough to judge them on. Press any row
      to flag it.`;
  } else {
    const groups = troubleByAxis(store, axis);
    body = groups.length
      ? groups.map(g => `<button class="trow" data-action="trouble-group" data-axis="${axis}" data-key="${escHtml(g.key)}">
          <span class="tFlag"></span>
          <span class="tGroup">${escHtml(axisLabel(axis, g.key))}</span>
          <span class="tScore"><b>${g.misses}</b>/${g.attempts} &middot; ${Math.round(g.rate*100)}%</span>
          <span class="tCell">${g.cellCount} cell${g.cellCount===1?'':'s'} answered &mdash; open</span>
        </button>`).join('')
      : `<p class="empty">Not enough answers yet to rank ${axis==='case'?'the cases':'by '+axis}.</p>`;
    foot = `Every cell of a ${axis} added together &mdash; the misses and the attempts are summed
      and the rate worked out from those, rather than averaging the rates of the cells, which
      would let one rarely-asked form outweigh a hundred common ones. Groups with fewer than
      ${TROUBLE_GROUP_FLOOR} answers are left out.`;
  }

  const canDrill = axis === 'cells';
  return `
    <div class="bar">
      <button class="icon" data-action="home" aria-label="Back">&#8249;</button>
      <div class="title">Where you keep slipping</div>
      <div class="spacer"></div>
    </div>
    <div class="troubleBar">${chips}${flagChip}${groupChip}</div>
    ${body}
    ${canDrill ? `<button class="card study" data-action="drill-trouble" style="margin-top:14px">
        <div class="t">Drill ${flaggedOnly ? 'the flagged cells' : group ? escHtml(axisLabel(group.axis, group.key).toLowerCase()) : 'these'}</div>
        <div class="d">nothing else in the queue</div></button>` : ''}
    <p class="troubleFoot">${foot}</p>`;
}

// A drill built from a list of cards rather than from what is due. Cells the
// deck no longer contains are dropped silently -- a card id survives in the
// log after its word is corrected out of the data, and scheduling a drill for
// a word that is gone is how a queue ends up with a blank prompt.
function startTroubleDrill(cardIds){
  const byId = Object.create(null);
  LATIN_VOCAB.forEach(e => { byId[e.id] = e; });
  const queue = [];
  cardIds.forEach(id => {
    const parts = splitCardId(id);
    if (!parts) return;
    const entry = byId[parts.wordId];
    if (!entry || !entryHasCell(entry, parts.category, parts.cell)) return;
    queue.push({ wordId: entry.id, entry, category: parts.category, cell: parts.cell,
                 card: store.cards[id] || null });
  });
  for (let i=queue.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [queue[i],queue[j]]=[queue[j],queue[i]]; }
  drillState = { clsKey:null, queue, pos:0, correct:0, total:queue.length };
  go({ screen:'drill' });
}
